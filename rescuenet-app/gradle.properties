# Project-wide Gradle settings.

# Required for every modern Android project — enables Jetpack (AndroidX) libraries, which
# this whole project is built on (Compose, Room, Hilt, Navigation, etc. are all AndroidX).
android.useAndroidX=true

# Kotlin code style for this project.
kotlin.code.style=official

# Default JVM args for the Gradle daemon — 2GB is enough for this project; bump it if you
# see OutOfMemoryError during a build on a memory-constrained machine.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enables parallel project execution and Gradle's build cache — meaningfully speeds up
# repeat builds, no downside for a project this size.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX libraries only — no legacy support-library dependencies in this project, so
# Jetifier (which rewrites old support-library references to AndroidX) is unnecessary and
# only slows the build down.
android.enableJetifier=false

# Use the non-transitive R class (AGP default recommendation since AGP 8) — slightly faster
# builds, no impact on this project's single-module structure.
android.nonTransitiveRClass=true
