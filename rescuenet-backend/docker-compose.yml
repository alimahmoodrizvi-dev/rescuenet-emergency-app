version: "3.8"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rescuenet
      POSTGRES_PASSWORD: rescuenet_dev_password
      POSTGRES_DB: rescuenet
    volumes:
      - rescuenet_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescuenet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RESCUENET_DATABASE_URL: postgresql://rescuenet:rescuenet_dev_password@db:5432/rescuenet
      # Override these in a real deployment — see .env.example:
      RESCUENET_JWT_SECRET: ${RESCUENET_JWT_SECRET:-CHANGE_ME_INSECURE_DEV_SECRET}
      RESCUENET_ANTHROPIC_API_KEY: ${RESCUENET_ANTHROPIC_API_KEY:-}
      RESCUENET_CORS_ALLOW_ORIGINS: ${RESCUENET_CORS_ALLOW_ORIGINS:-*}
    ports:
      - "8000:8000"

volumes:
  rescuenet_pgdata:
