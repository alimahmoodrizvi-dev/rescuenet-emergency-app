[pytest]
# Ensures `from app.main import app` (in tests/conftest.py) resolves correctly no matter how
# pytest is invoked — bare `pytest`, `python -m pytest`, from this directory, from a
# different working directory, or on Windows where cwd isn't auto-added to sys.path the way
# it is on some other setups. Without this, `pytest tests/ -v` can fail with
# "ModuleNotFoundError: No module named 'app'" even though the code is correct — pytest's
# default import-mode only adds the *test file's* directory to sys.path, not the project
# root where the `app/` package actually lives.
pythonpath = .
